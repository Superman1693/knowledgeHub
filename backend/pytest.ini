[pytest]
# 测试入口统一在 tests/，这样 `pytest` 一个词就能跑全套
testpaths = tests

# ⚠️ basetemp 必须放在项目内。
# 本机的「安全删除」保护会在 pytest 清理 %TEMP% 下旧临时目录时掐断进程，
# 而且**不打印任何失败详情**（只看到 F，看不到 traceback），极难排查。
# 写进配置而不是让每个人记着敲 --basetemp，避免换个终端就复现。
addopts = --basetemp=.pytest_tmp

# 测试环境由 tests/conftest.py 负责隔离：
#   - 数据库：独立 schema kh_test（不碰真实库）
#   - 文件：系统临时目录（整轮结束删除，不在 data/ 留残留）
# 所以这里不需要任何额外的环境变量准备。
